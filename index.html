<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מצב בדיקה - צוות גיל</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdqf9bo_mMiMxjXU24zMnrDgX4qTLcHwM",
            authDomain: "gorilla-training.firebaseapp.com",
            databaseURL: "https://gorilla-training-default-rtdb.firebaseio.com",
            projectId: "gorilla-training",
            storageBucket: "gorilla-training.firebasestorage.app",
            messagingSenderId: "407883236078",
            appId: "1:407883236078:web:6473279dba7520a32fa9ff",
            measurementId: "G-9LZQPRKYNT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = () => signInWithRedirect(auth, provider);

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById("auth-screen");
            const mainContent = document.getElementById("main-content");
            const debugLog = document.getElementById("debug-log");

            if (user) {
                // המערכת מזהה משתמש!
                debugLog.innerText = "זוהה משתמש: " + user.email;
                authScreen.style.display = "none";
                mainContent.style.display = "block";
            } else {
                debugLog.innerText = "אין משתמש מחובר";
                authScreen.style.display = "flex";
                mainContent.style.display = "none";
            }
        });
    </script>
</head>
<body>
    <div id="auth-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#121212; color:white;">
        <h2>מצב בדיקת התחברות</h2>
        <button onclick="loginWithGoogle()" style="padding:15px; cursor:pointer;">התחבר עם Google</button>
        <p id="debug-log" style="color:yellow; margin-top:20px;"></p>
    </div>

    <div id="main-content" style="display:none;">
        <h1>התחברת בהצלחה!</h1>
        <button onclick="location.reload()">רענן אתר</button>
    </div>
</body>
</html>
