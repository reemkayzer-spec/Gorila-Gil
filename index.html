<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תפעול והדרכה - צוות גיל</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdqf9bo_mMiMxjXU24zMnrDgX4qTLcHwM",
            authDomain: "gorilla-training.firebaseapp.com",
            databaseURL: "https://gorilla-training-default-rtdb.firebaseio.com",
            projectId: "gorilla-training",
            storageBucket: "gorilla-training.firebasestorage.app",
            messagingSenderId: "407883236078",
            appId: "1:407883236078:web:6473279dba7520a32fa9ff",
            measurementId: "G-9LZQPRKYNT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        window.fbDB = getDatabase(app);
        window.fbRef = ref; window.fbSet = set; window.fbOnValue = onValue; window.fbGet = get;

        window.trainerGorillaMap = {
            "איתי הקר": ["גורילה 3", "גורילה 7"],
            "עדיאל קסה": ["גורילה 1", "גורילה 5"]
        };

        const allowedEmails = ["NadavYichye@gmail.com", "reemkayzer@gmail.com", "itayhaker19@gmail.com", "netashatzberg@gmail.com", "idolevko2@gmail.com", "adielkassa@gmail.com", "tomerk2001@gmail.com"];

        window.loginWithGoogle = () => signInWithRedirect(auth, provider);
        window.logout = () => signOut(auth);

        getRedirectResult(auth).catch(console.error);

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById("auth-screen");
            const mainContent = document.getElementById("main-content");
            if (user && allowedEmails.some(email => email.toLowerCase() === user.email.toLowerCase())) {
                authScreen.style.display = "none";
                mainContent.style.display = "block";
                window.dispatchEvent(new Event('firebase-ready'));
            } else {
                if (user) signOut(auth);
                authScreen.style.display = "flex";
                mainContent.style.display = "none";
            }
        });
    </script>

    <style>
        :root { --bg-color: #f4f6f9; --main-bg: #ffffff; --text-color: #2c3e50; --header-bg: #1a252f; --border-color: #e2e8f0; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; }
        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #121212; color: white; position: fixed; width: 100%; z-index: 9999; }
        .login-btn { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
        #main-content { display: none; }
        header { background-color: var(--header-bg); color: white; padding: 10px; text-align: center; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; }
        .tab-btn { background-color: #34495e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background-color: #3498db; }
        main { max-width: 1400px; margin: 20px auto; padding: 20px; background: var(--main-bg); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; }
        .cell-input { width: 100%; border: none; background: transparent; text-align: center; }
        .cell-select { width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2>הגישה לדף זה מוגבלת למורשים בלבד</h2>
        <button class="login-btn" onclick="loginWithGoogle()">התחבר עם Google</button>
        <p id="error-msg"></p>
    </div>

    <div id="main-content">
        <header>
            <h1>תפעול והדרכה - צוות גיל</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('schedule', event)">📅 סידור עבודה</button>
            </div>
        </header>
        <main>
            <section id="schedule" class="tab-content active">
                <div class="spreadsheet-container">
                    <div class="sheet-box">
                        <table id="sheetNorthTable"><thead><tr><th>תאריך</th><th>מדריך</th><th>כוח</th><th>מיקום</th><th>גורילה</th></tr></thead><tbody id="northTableBody"></tbody></table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // המנוע הראשי
        let allMonthsData = {};
        window.activeMonth = new Date().getMonth();

        window.addEventListener('firebase-ready', () => {
            loadMonthDataFromCloud(window.activeMonth);
        });

        function loadMonthDataFromCloud(monthIdx) {
            const sheetRef = window.fbRef(window.fbDB, `sheets/2026_${monthIdx}`);
            window.fbOnValue(sheetRef, (snapshot) => {
                allMonthsData[monthIdx] = snapshot.val() || { north: [] };
                renderCurrentWeekTables();
            });
        }

        window.handleGuideSelection = function(side, monthIdx, cacheIndex, fieldIndex, selectEl) {
            let val = selectEl.value;
            // שמירה ל-Firebase
            updateCacheAndSave(side, monthIdx, cacheIndex, fieldIndex, val);
            
            // מילוי אוטומטי של גורילות
            if (fieldIndex === 1 && window.trainerGorillaMap[val]) {
                const defaults = window.trainerGorillaMap[val];
                const monthData = allMonthsData[monthIdx];
                if (monthData.north[cacheIndex] && (!monthData.north[cacheIndex].values[4] || monthData.north[cacheIndex].values[4] === "")) {
                     updateCacheAndSave(side, monthIdx, cacheIndex, 4, defaults[0]);
                }
            }
            renderCurrentWeekTables(); // ריענון מידי
        };

        function updateCacheAndSave(side, monthIdx, cacheIndex, fieldIndex, value) {
            if (!allMonthsData[monthIdx]) allMonthsData[monthIdx] = { north: [] };
            if (!allMonthsData[monthIdx].north[cacheIndex]) allMonthsData[monthIdx].north[cacheIndex] = { values: Array(5).fill("") };
            allMonthsData[monthIdx].north[cacheIndex].values[fieldIndex] = value;
            window.fbSet(window.fbRef(window.fbDB, `sheets/2026_${monthIdx}`), allMonthsData[monthIdx]);
        }

        function renderCurrentWeekTables() {
            const body = document.getElementById('northTableBody');
            body.innerHTML = '';
            const data = allMonthsData[window.activeMonth]?.north || [];
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input class="cell-input" value="${row.values[0] || ''}" onchange="updateCacheAndSave('north', ${window.activeMonth}, ${idx}, 0, this.value)"></td>
                    <td>
                        <select class="cell-select" onchange="handleGuideSelection('north', ${window.activeMonth}, ${idx}, 1, this)">
                            ${['', 'איתי הקר', 'עדיאל קסה'].map(g => `<option value="${g}" ${row.values[1] === g ? 'selected' : ''}>${g}</option>`).join('')}
                        </select>
                    </td>
                    <td><input class="cell-input" value="${row.values[2] || ''}" onchange="updateCacheAndSave('north', ${window.activeMonth}, ${idx}, 2, this.value)"></td>
                    <td><input class="cell-input" value="${row.values[3] || ''}" onchange="updateCacheAndSave('north', ${window.activeMonth}, ${idx}, 3, this.value)"></td>
                    <td><input class="cell-input" value="${row.values[4] || ''}" onchange="updateCacheAndSave('north', ${window.activeMonth}, ${idx}, 4, this.value)"></td>
                `;
                body.appendChild(tr);
            });
        }
        
        function switchTab(id, e) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
