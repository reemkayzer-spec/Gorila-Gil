        ];

        window.loginWithGoogle = () => signInWithRedirect(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById("auth-screen");
            const mainContent = document.getElementById("main-content");
            if (user && allowedEmails.some(email => email.toLowerCase() === user.email.toLowerCase())) {

    <script>
        // לוגיקה משופרת לבחירה אוטומטית של גורילות
        function handleGuideSelection(side, monthIdx, cacheIndex, fieldIndex, selectEl) {
            let val = selectEl.value;
            // עדכון הערך ב-Firebase
            updateCacheAndSave(side, monthIdx, cacheIndex, fieldIndex, val);
            
            // לוגיקה לברירת מחדל של גורילות
            if (fieldIndex === 1 && window.trainerGorillaMap[val]) {
                const defaults = window.trainerGorillaMap[val];
                const monthData = getMonthDataCache(monthIdx);
                const row = side === 'north' ? monthData.north[cacheIndex] : monthData.south[cacheIndex];
                
                // ממלא רק אם ריק
                if (row && !row.values[7]) updateCacheAndSave(side, monthIdx, cacheIndex, 7, defaults[0]);
                if (row && !row.values[11]) updateCacheAndSave(side, monthIdx, cacheIndex, 11, defaults[1]);
            }
            renderCurrentWeekTables();
        }

        // שאר הפונקציות (save, update, render) נשארות זהות
        // מומלץ להעתיק את כל ה-Script המלא מהקוד ששלחתי קודם לכן כדי לוודא תאימות
    </script>
