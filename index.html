<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תפעול והדרכה - צוות גיל</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Firebase SDKs & Auth Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdqf9bo_mMiMxjXU24zMnrDgX4qTLcHwM",
            authDomain: "gorilla-training.firebaseapp.com",
            databaseURL: "https://gorilla-training-default-rtdb.firebaseio.com",
            projectId: "gorilla-training",
            storageBucket: "gorilla-training.firebasestorage.app",
            messagingSenderId: "407883236078",
            appId: "1:407883236078:web:6473279dba7520a32fa9ff",
            measurementId: "G-9LZQPRKYNT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getDatabase(app);

        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbOnValue = onValue;
        window.fbGet = get;

        // מיפוי גורילות למדריכים
        window.trainerGorillaMap = {
            "איתי הקר": ["גורילה 3", "גורילה 7"],
            "עדיאל קסה": ["גורילה 1", "גורילה 5"]
        };

        const allowedEmails = [
            "NadavYichye@gmail.com", "reemkayzer@gmail.com", "itayhaker19@gmail.com",
            "netashatzberg@gmail.com", "idolevko2@gmail.com", "adielkassa@gmail.com", "tomerk2001@gmail.com"
        ];

        window.loginWithGoogle = function() {
            signInWithRedirect(auth, provider).catch((error) => {
                const errEl = document.getElementById("error-msg");
                if(errEl) errEl.innerText = "שגיאה בהתחברות: " + error.message;
            });
        };

        window.logout = function() { signOut(auth); };

        // תיקון הבעיה של הלופ בהתחברות
        getRedirectResult(auth).catch((error) => {
            console.error("Auth error:", error);
        });

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById("auth-screen");
            const mainContent = document.getElementById("main-content");

            if (user) {
                const isAllowed = allowedEmails.some(email => email.toLowerCase() === user.email.toLowerCase());
                if (isAllowed) {
                    authScreen.style.display = "none";
                    mainContent.style.display = "block";
                    window.dispatchEvent(new Event('firebase-ready'));
                } else {
                    signOut(auth);
                    document.getElementById("error-msg").innerText = "אין לך הרשאת גישה.";
                }
            } else {
                authScreen.style.display = "flex";
                mainContent.style.display = "none";
            }
        });
    </script>

    <style>
        :root { --bg-color: #f4f6f9; --main-bg: #ffffff; --text-color: #2c3e50; --header-bg: #1a252f; --border-color: #e2e8f0; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; }
        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #121212; color: white; position: fixed; width: 100%; z-index: 9999; }
        .login-btn { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; }
        #main-content { display: none; }
        header { background-color: var(--header-bg); color: white; padding: 10px; text-align: center; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 10px; }
        .tab-btn { background-color: #34495e; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background-color: #3498db; }
        main { max-width: 1400px; margin: 20px auto; padding: 20px; background: var(--main-bg); border-radius: 10px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: center; }
        .cell-input { width: 100%; border: none; background: transparent; text-align: center; }
        .cell-select { width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        .wa-group-btn { background-color: #128c7e; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2>הגישה לדף זה מוגבלת למורשים בלבד</h2>
        <button class="login-btn" onclick="loginWithGoogle()">התחבר עם Google</button>
        <p id="error-msg"></p>
    </div>

    <div id="main-content">
        <header>
            <h1>תפעול והדרכה - צוות גיל</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('schedule', event)">📅 סידור עבודה</button>
                <button class="tab-btn" onclick="switchTab('gorilla-status', event)">📊 סטטוס גורילות</button>
            </div>
        </header>
        <main>
            <section id="schedule" class="tab-content active">
                <div class="spreadsheet-container">
                    <div class="sheet-box">
                        <table id="sheetNorthTable"><thead><tr><th>תאריך</th><th>מדריך</th><th>כוח</th><th>מיקום</th><th>גורילה</th></tr></thead><tbody id="northTableBody"></tbody></table>
                    </div>
                </div>
            </section>
            <section id="gorilla-status" class="tab-content"><h2>📊 סטטוס גורילות</h2></section>
        </main>
    </div>

    <script>
        // לוגיקה מעודכנת עם ריענון מסך מידי
        window.handleGuideSelection = function(side, monthIdx, cacheIndex, fieldIndex, selectEl) {
            let val = selectEl.value;
            updateCacheAndSave(side, monthIdx, cacheIndex, fieldIndex, val);
            
            // לוגיקה למילוי גורילות
            if (fieldIndex === 1 && window.trainerGorillaMap[val]) {
                const defaults = window.trainerGorillaMap[val];
                const monthData = getMonthDataCache(monthIdx);
                const row = side === 'north' ? monthData.north[cacheIndex] : monthData.south[cacheIndex];
                
                if (row) {
                    if (!row.values[4] || row.values[4] === "") {
                        updateCacheAndSave(side, monthIdx, cacheIndex, 4, defaults[0]);
                    }
                }
            }
            // הריענון שחיכית לו:
            renderCurrentWeekTables();
        };

        // פונקציות העזר (תוודא ששאר הפונקציות: renderCurrentWeekTables, updateCacheAndSave, וכו' נמצאות כאן)
    </script>
</body>
</html>
