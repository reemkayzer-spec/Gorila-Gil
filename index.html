<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בדיקת התחברות מתקדמת</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdqf9bo_mMiMxjXU24zMnrDgX4qTLcHwM",
            authDomain: "gorilla-training.firebaseapp.com",
            databaseURL: "https://gorilla-training-default-rtdb.firebaseio.com",
            projectId: "gorilla-training",
            storageBucket: "gorilla-training.firebasestorage.app",
            messagingSenderId: "407883236078",
            appId: "1:407883236078:web:6473279dba7520a32fa9ff",
            measurementId: "G-9LZQPRKYNT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = () => {
            signInWithRedirect(auth, provider).catch(err => {
                document.getElementById("debug-log").innerText = "שגיאת שליחה: " + err.message;
            });
        };

        // קריטי עבור GitHub Pages עם נתיב משנה (/Gorila-Gil/)
        getRedirectResult(auth).then((result) => {
            if (result && result.user) {
                document.getElementById("debug-log").innerText = "התחברות הצליחה! טוען נתונים...";
            }
        }).catch((error) => {
            document.getElementById("debug-log").innerText = "שגיאת RedirectResult: " + error.message;
        });

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById("auth-screen");
            const mainContent = document.getElementById("main-content");
            const debugLog = document.getElementById("debug-log");

            if (user) {
                debugLog.innerText = "זוהה משתמש: " + user.email;
                authScreen.style.display = "none";
                mainContent.style.display = "block";
            } else {
                authScreen.style.display = "flex";
                mainContent.style.display = "none";
            }
        });
    </script>
</head>
<body>
    <div id="auth-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#121212; color:white; text-align:center; padding:20px;">
        <h2>בדיקת התחברות מדויקת</h2>
        <button onclick="loginWithGoogle()" style="padding:15px 25px; cursor:pointer; font-size:16px; background:#4285F4; color:white; border:none; border-radius:6px; font-weight:bold;">התחבר עם Google</button>
        <p id="debug-log" style="color:yellow; margin-top:20px; font-weight:bold;"></p>
    </div>

    <div id="main-content" style="display:none; text-align:center; padding:50px; background:#121212; color:white; height:100vh;">
        <h1>התחברת בהצלחה! 🎉</h1>
    </div>
</body>
</html>
